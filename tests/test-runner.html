<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE Calculator Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-card.pass {
            background: #d1fae5;
            border-left: 4px solid #10b981;
        }

        .stat-card.fail {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
        }

        .stat-card.total {
            background: #dbeafe;
            border-left: 4px solid #2563eb;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
        }

        .suite-header {
            background: #f9fafb;
            padding: 15px 20px;
            font-weight: 600;
            color: #1f2937;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suite-header:hover {
            background: #f3f4f6;
        }

        .test-case {
            padding: 12px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-case.pass {
            background: #f0fdf4;
        }

        .test-case.fail {
            background: #fef2f2;
        }

        .test-name {
            flex: 1;
        }

        .test-status {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .test-status.pass {
            color: #10b981;
            background: #d1fae5;
        }

        .test-status.fail {
            color: #ef4444;
            background: #fee2e2;
        }

        .run-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .run-button:hover {
            background: #1d4ed8;
        }

        .run-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 5px;
            font-family: 'Courier New', monospace;
        }

        .progress-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #2563eb);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 FIRE Calculator Test Suite</h1>
        <p class="subtitle">Comprehensive unit and integration tests</p>

        <button class="run-button" id="runTests" onclick="runAllTests()">▶ Run All Tests</button>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>

        <div class="summary">
            <div class="stat-card total">
                <div class="stat-number" id="totalTests">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card pass">
                <div class="stat-number" id="passedTests">0</div>
                <div class="stat-label">Passed ✓</div>
            </div>
            <div class="stat-card fail">
                <div class="stat-number" id="failedTests">0</div>
                <div class="stat-label">Failed ✗</div>
            </div>
        </div>

        <div id="testResults"></div>
    </div>

    <script>
        // Simple test framework
        const testResults = [];
        let currentSuite = '';

        function describe(name, fn) {
            currentSuite = name;
            fn();
        }

        function test(name, fn) {
            try {
                fn();
                testResults.push({ suite: currentSuite, name, status: 'pass' });
            } catch (error) {
                testResults.push({ suite: currentSuite, name, status: 'fail', error: error.message });
            }
        }

        const expect = (actual) => ({
            toBe: (expected) => {
                if (actual !== expected) {
                    throw new Error(`Expected ${expected}, got ${actual}`);
                }
            },
            toBeGreaterThan: (expected) => {
                if (!(actual > expected)) {
                    throw new Error(`Expected ${actual} to be greater than ${expected}`);
                }
            },
            toBeLessThan: (expected) => {
                if (!(actual < expected)) {
                    throw new Error(`Expected ${actual} to be less than ${expected}`);
                }
            },
            toBeGreaterThanOrEqual: (expected) => {
                if (!(actual >= expected)) {
                    throw new Error(`Expected ${actual} to be >= ${expected}`);
                }
            },
            toBeLessThanOrEqual: (expected) => {
                if (!(actual <= expected)) {
                    throw new Error(`Expected ${actual} to be <= ${expected}`);
                }
            },
            toBeCloseTo: (expected, precision = 2) => {
                const factor = Math.pow(10, precision);
                if (Math.round(actual * factor) !== Math.round(expected * factor)) {
                    throw new Error(`Expected ${actual} to be close to ${expected}`);
                }
            }
        });

        function runAllTests() {
            testResults.length = 0;
            document.getElementById('runTests').disabled = true;
            document.getElementById('testResults').innerHTML = '';

            // Include all tests from calculator.test.js here
            // For demo purposes, running subset of key tests

            // Test Suite 1: Core FIRE Calculations
            describe('FIRE Number Calculations', () => {
                test('should calculate basic FIRE number correctly', () => {
                    const annualExpenses = 50000;
                    const withdrawalRate = 0.04;
                    const taxRate = 0.15;
                    const expectedFIRE = (annualExpenses / (1 - taxRate)) / withdrawalRate;
                    expect(Math.round(expectedFIRE)).toBe(1470588);
                });

                test('should handle 4% rule correctly', () => {
                    const expenses = 40000;
                    const fireNumber = expenses / 0.04;
                    expect(fireNumber).toBe(1000000);
                });
            });

            // Test Suite 2: Tax Buckets
            describe('Tax Bucket Calculations', () => {
                test('should calculate after-tax value of pre-tax savings', () => {
                    const preTax = 100000;
                    const taxRate = 0.22;
                    const afterTax = preTax * (1 - taxRate);
                    expect(afterTax).toBe(78000);
                });

                test('should validate $1M in Roth > $1M in Traditional', () => {
                    const amount = 1000000;
                    const taxRate = 0.24;
                    const rothValue = amount;
                    const traditionalValue = amount * (1 - taxRate);
                    expect(rothValue).toBeGreaterThan(traditionalValue);
                });
            });

            // Test Suite 3: CoastFIRE
            describe('CoastFIRE Calculations', () => {
                test('should calculate CoastFIRE number correctly', () => {
                    const fireNumber = 1000000;
                    const yearsToRetirement = 20;
                    const investmentReturn = 0.07;
                    const coastFIRE = fireNumber / Math.pow(1 + investmentReturn, yearsToRetirement);
                    expect(Math.round(coastFIRE)).toBe(258419);
                });
            });

            // Render results
            renderResults();
        }

        function renderResults() {
            const suites = {};
            testResults.forEach(result => {
                if (!suites[result.suite]) {
                    suites[result.suite] = [];
                }
                suites[result.suite].push(result);
            });

            let html = '';
            for (const [suite, tests] of Object.entries(suites)) {
                const passed = tests.filter(t => t.status === 'pass').length;
                const total = tests.length;

                html += `
                    <div class="test-suite">
                        <div class="suite-header">
                            <span>${suite}</span>
                            <span>${passed}/${total} passed</span>
                        </div>
                        ${tests.map(test => `
                            <div class="test-case ${test.status}">
                                <div class="test-name">
                                    ${test.name}
                                    ${test.error ? `<div class="error-message">${test.error}</div>` : ''}
                                </div>
                                <span class="test-status ${test.status}">${test.status === 'pass' ? '✓ PASS' : '✗ FAIL'}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            document.getElementById('testResults').innerHTML = html;

            const total = testResults.length;
            const passed = testResults.filter(r => r.status === 'pass').length;
            const failed = total - passed;

            document.getElementById('totalTests').textContent = total;
            document.getElementById('passedTests').textContent = passed;
            document.getElementById('failedTests').textContent = failed;
            document.getElementById('progressBar').style.width = `${(passed / total) * 100}%`;
            document.getElementById('runTests').disabled = false;
        }
    </script>
</body>
</html>
